name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # O script `prepare` já roda `npm run build` aqui; o passo de build abaixo
      # continua explícito para o CI falhar com uma mensagem clara se a compilação quebrar.
      - run: npm ci

      - name: Checagem de tipos
        run: npx tsc --noEmit

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

      # php -l em todo PHP gerado das fixtures, via Docker (imagem php:8.1-cli).
      - name: Sintaxe do PHP gerado
        run: npm run lint:php
